<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKV → MP4 (No Server-Side)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:24px;max-width:960px}
    .card{border:1px solid #ddd;border-radius:14px;padding:14px}
    label{display:block;font-size:13px;margin:6px 0}
    input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:10px}
    button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .muted{color:#666;font-size:13px;margin-top:8px;line-height:1.35}
    pre{background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto;white-space:pre-wrap}
    a{word-break:break-all}
    video{width:100%;max-height:420px;background:#000;border-radius:12px;margin-top:10px}
  </style>
</head>
<body>
  <h1>MKV → MP4 (client-side)</h1>

  <div class="card">
    <label>MKV URL</label>
    <input id="mkvUrl" value="http://line.tx-4k.com/series/b126a24d3f/36a7e66d5d43/1885218.mkv" />

    <div class="row">
      <button id="loadBtn">Load FFmpeg Core</button>
      <button id="convertBtn" disabled>Convert to MP4</button>
      <button id="downloadBtn" disabled>Download MP4</button>
    </div>

    <div class="muted" id="status">Status: idle</div>
    <div class="muted">
      Note: This creates a temporary <code>blob:</code> MP4 URL (not a permanent .mp4 link).  
      If conversion fails instantly, your MKV host is likely blocking CORS.
    </div>

    <video id="player" controls></video>

    <div class="muted" style="margin-top:10px"><strong>Output (blob URL):</strong></div>
    <a id="outLink" href="#" target="_blank" rel="noopener">—</a>

    <pre id="log" style="margin-top:10px">Logs will appear here…</pre>
  </div>

  <script type="module">
    // Uses official FFmpeg + toBlobURL approach (docs). :contentReference[oaicite:2]{index=2}
    import { FFmpeg } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js";
    import { fetchFile, toBlobURL } from "https://unpkg.com/@ffmpeg/util@0.12.2/dist/esm/index.js";

    const $ = (id) => document.getElementById(id);
    const ffmpeg = new FFmpeg();

    let mp4Blob = null;
    let mp4Url = "";

    function setStatus(s){ $("status").textContent = "Status: " + s; }
    function logLine(s){ $("log").textContent += (s + "\n"); }

    ffmpeg.on("log", ({ message }) => logLine(message));

    $("loadBtn").addEventListener("click", async () => {
      $("log").textContent = "";
      setStatus("loading ffmpeg core (~tens of MB)…");

      try {
        // Single-thread core (no SharedArrayBuffer requirements).
        const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.10/dist/esm"; // version list exists on unpkg :contentReference[oaicite:3]{index=3}

        // toBlobURL helps avoid CORS issues for loading core assets. :contentReference[oaicite:4]{index=4}
        await ffmpeg.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
        });

        setStatus("ffmpeg loaded ✅");
        $("convertBtn").disabled = false;
      } catch (e) {
        setStatus("error loading ffmpeg ❌");
        logLine("\nERROR: " + (e?.message || String(e)));
      }
    });

    $("convertBtn").addEventListener("click", async () => {
      mp4Blob = null;
      mp4Url = "";
      $("downloadBtn").disabled = true;
      $("outLink").textContent = "—";
      $("outLink").href = "#";
      $("player").src = "";

      const url = $("mkvUrl").value.trim();
      if (!url) return;

      $("log").textContent = "";
      setStatus("fetching MKV… (will fail if host blocks CORS)");

      try {
        // This fetch MUST be allowed by the MKV host via CORS.
        const inputData = await fetchFile(url);

        setStatus("writing input file…");
        await ffmpeg.writeFile("input.mkv", inputData);

        setStatus("transcoding to MP4…");
        // Basic MP4 output (H.264 video + AAC audio)
        await ffmpeg.exec([
          "-i", "input.mkv",
          "-c:v", "libx264",
          "-preset", "veryfast",
          "-crf", "23",
          "-c:a", "aac",
          "-b:a", "128k",
          "-movflags", "+faststart",
          "output.mp4"
        ]);

        setStatus("reading output…");
        const out = await ffmpeg.readFile("output.mp4");

        mp4Blob = new Blob([out.buffer], { type: "video/mp4" });
        mp4Url = URL.createObjectURL(mp4Blob);

        $("player").src = mp4Url;
        $("outLink").textContent = mp4Url;
        $("outLink").href = mp4Url;
        $("downloadBtn").disabled = false;

        setStatus("done ✅ (blob URL created)");
      } catch (e) {
        setStatus("conversion failed ❌");
        logLine("\nERROR: " + (e?.message || String(e)));
        logLine("\nIf the error mentions CORS, your MKV host is blocking cross-origin download.");
      }
    });

    $("downloadBtn").addEventListener("click", () => {
      if (!mp4Blob) return;
      const a = document.createElement("a");
      a.href = mp4Url;
      a.download = "converted.mp4";
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  </script>
</body>
</html>
