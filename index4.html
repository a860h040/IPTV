<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKV → MP4 (No Server)</title>
  <style>
    :root{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#9aa7b0;--accent:#2f81f7;--border:#232a31}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:1000px;margin:0 auto;padding:20px}
    h1{margin:0 0 12px 0;font-size:22px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input[type="text"]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#0b1220;color:var(--text)}
    input[type="file"]{width:100%;color:var(--muted)}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    button{
      padding:10px 12px;border-radius:12px;border:1px solid var(--border);
      background:#0b1220;color:var(--text);cursor:pointer
    }
    button.primary{border-color:rgba(47,129,247,.55);background:rgba(47,129,247,.12)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .status{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.35}
    .out{margin-top:10px;font-size:13px;color:var(--muted)}
    a{color:var(--accent);word-break:break-all}
    video{width:100%;margin-top:12px;border-radius:14px;background:#000;max-height:520px}
    pre{margin-top:12px;padding:12px;border-radius:14px;background:#0b1220;border:1px solid var(--border);overflow:auto;max-height:260px;color:#d1d5db;font-size:12px;white-space:pre-wrap}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:12px;margin-left:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MKV → MP4 <span class="pill">no server / browser-only</span></h1>

    <div class="card">
      <label>MKV URL (may fail if the host blocks CORS)</label>
      <input id="mkvUrl" type="text" value="http://line.tx-4k.com/series/b126a24d3f/36a7e66d5d43/1885218.mkv" />

      <label>Or select a local MKV file (works even if URL is blocked)</label>
      <input id="fileInput" type="file" accept=".mkv,video/x-matroska,video/*" />

      <div class="row">
        <button id="loadBtn" class="primary">Load FFmpeg</button>
        <button id="convertUrlBtn" disabled>Convert URL → MP4</button>
        <button id="convertFileBtn" disabled>Convert Local MKV File → MP4</button>
        <button id="downloadBtn" disabled>Download MP4</button>
      </div>

      <div class="status" id="status">Status: idle</div>

      <div class="out"><strong>MP4 (temporary blob URL):</strong> <a id="outLink" href="#" target="_blank" rel="noopener">—</a></div>

      <video id="player" controls></video>

      <pre id="log">Logs…</pre>
    </div>
  </div>

  <script type="module">
    import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js";
    import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";

    const $ = (id) => document.getElementById(id);

    const ffmpeg = new FFmpeg();
    let loaded = false;

    let mp4Blob = null;
    let mp4Url = "";

    function setStatus(s){ $("status").textContent = "Status: " + s; }
    function log(s){ $("log").textContent += s + "\n"; }
    function resetOutput(){
      mp4Blob = null;
      if (mp4Url) URL.revokeObjectURL(mp4Url);
      mp4Url = "";
      $("outLink").textContent = "—";
      $("outLink").href = "#";
      $("player").removeAttribute("src");
      $("player").load();
      $("downloadBtn").disabled = true;
    }

    ffmpeg.on("log", ({ message }) => log(message));

    async function loadFFmpeg() {
      $("log").textContent = "";
      setStatus("loading ffmpeg (~31MB wasm)…");

      // Use single-thread core (works on GitHub Pages without special headers)
      const coreBase = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";
      // This is the wrapper worker from @ffmpeg/ffmpeg (the one that caused your error)
      const ffmpegBase = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm";

      // Blob URLs avoid cross-origin Worker restrictions
      const [coreURL, wasmURL, classWorkerURL] = await Promise.all([
        toBlobURL(`${coreBase}/ffmpeg-core.js`, "text/javascript"),
        toBlobURL(`${coreBase}/ffmpeg-core.wasm`, "application/wasm"),
        toBlobURL(`${ffmpegBase}/worker.js`, "text/javascript"),
      ]);

      await ffmpeg.load({ coreURL, wasmURL, classWorkerURL });

      loaded = true;
      $("convertUrlBtn").disabled = false;
      $("convertFileBtn").disabled = false;
      setStatus("ffmpeg loaded ✅");
    }

    async function runConvert(inputName) {
      resetOutput();
      $("log").textContent = "";

      // 1) Try fast remux first (no re-encode). If it fails, fallback to re-encode.
      const tryRemux = async () => {
        setStatus("remuxing MKV → MP4 (fast, no re-encode)…");
        await ffmpeg.exec([
          "-i", inputName,
          "-map", "0",
          "-c", "copy",
          "-movflags", "+faststart",
          "output.mp4"
        ]);
      };

      const tryReencode = async () => {
        setStatus("transcoding MKV → MP4 (re-encode)…");
        await ffmpeg.exec([
          "-i", inputName,
          "-c:v", "libx264",
          "-preset", "veryfast",
          "-crf", "23",
          "-c:a", "aac",
          "-b:a", "128k",
          "-movflags", "+faststart",
          "output.mp4"
        ]);
      };

      try {
        try {
          await tryRemux();
        } catch (e) {
          log("\nRemux failed, falling back to re-encode…");
          await tryReencode();
        }

        setStatus("reading output…");
        const out = await ffmpeg.readFile("output.mp4");

        mp4Blob = new Blob([out.buffer], { type: "video/mp4" });
        mp4Url = URL.createObjectURL(mp4Blob);

        $("outLink").textContent = mp4Url;
        $("outLink").href = mp4Url;

        $("player").src = mp4Url;
        $("downloadBtn").disabled = false;

        setStatus("done ✅ (blob URL created)");
      } catch (e) {
        setStatus("conversion failed ❌");
        log("\nERROR: " + (e?.message || String(e)));
      }
    }

    $("loadBtn").addEventListener("click", async () => {
      try { await loadFFmpeg(); }
      catch (e) {
        setStatus("error loading ffmpeg ❌");
        log("\nERROR: " + (e?.message || String(e)));
      }
    });

    $("convertUrlBtn").addEventListener("click", async () => {
      if (!loaded) return;
      const url = $("mkvUrl").value.trim();
      if (!url) return;

      try {
        setStatus("fetching MKV from URL… (may fail if CORS blocked)");
        const data = await fetchFile(url); // <-- requires CORS allowed by the MKV host
        setStatus("writing input file…");
        await ffmpeg.writeFile("input.mkv", data);
        await runConvert("input.mkv");
      } catch (e) {
        setStatus("URL fetch failed ❌ (likely CORS)");
        log("\nERROR: " + (e?.message || String(e)));
        log("\nTip: If the host blocks CORS, use 'Convert Local MKV File' instead.");
      }
    });

    $("convertFileBtn").addEventListener("click", async () => {
      if (!loaded) return;
      const f = $("fileInput").files?.[0];
      if (!f) { setStatus("please choose a local MKV file first"); return; }

      try {
        setStatus("reading local file…");
        await ffmpeg.writeFile("input.mkv", await fetchFile(f));
        await runConvert("input.mkv");
      } catch (e) {
        setStatus("file conversion failed ❌");
        log("\nERROR: " + (e?.message || String(e)));
      }
    });

    $("downloadBtn").addEventListener("click", () => {
      if (!mp4Blob || !mp4Url) return;
      const a = document.createElement("a");
      a.href = mp4Url;
      a.download = "converted.mp4";
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  </script>
</body>
</html>
