<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IPTV — Live · Movies · Series (Categories + Favorites)</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --accent:#2f81f7; --text:#e6edf3; --muted:#9aa7b0; --border:#232a31; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial;display:flex;flex-direction:column;min-height:100vh}
  header{background:var(--panel);padding:10px 20px;font-weight:700;color:var(--accent);text-align:center;border-bottom:1px solid #30363d}
  main{flex:1;display:grid;grid-template-columns:320px 240px 1fr;gap:0;min-height:0}

  /* Left login/nav */
  #left{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px;border-right:1px solid #30363d;min-height:0}
  input,button{border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;padding:10px}
  button{background:var(--accent);border:none;font-weight:700;cursor:pointer}
  button.ghost{background:#1c2128;border:1px solid #30363d}
  #status{font-size:.85rem;color:var(--muted);padding-top:6px;min-height:22px}
  .pill{display:inline-block;background:#1c2128;border:1px solid #30363d;border-radius:999px;padding:3px 8px;margin-right:6px}
  .ok{color:#22c55e;border-color:#1e3f2b;background:#0f1a13}
  .err{color:#ef4444;border-color:#3a1214;background:#140a0b}
  .warn{color:#fbbf24;border-color:#3a2d12;background:#140f0a}

  /* Middle: categories */
  #cats{background:#0f141a;border-right:1px solid #30363d;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
  #cats h4{margin:0 0 6px 0;color:#cbd5e1}
  .catbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:#0b0f14;color:#d1d7df;cursor:pointer}
  .catbtn.active{border-color:#2f81f7;background:#132036}
  .badge{font-size:.75rem;color:#a7b0ba;background:#12171d;border:1px solid #26303a;border-radius:999px;padding:2px 6px}

  /* Right: content */
  #right{display:flex;flex-direction:column;min-width:0;min-height:0}
  #toolbar{display:none;gap:10px;padding:10px;background:var(--panel);border-bottom:1px solid #30363d;align-items:center}
  #search{flex:1;min-width:220px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;padding:10px}
  #grid{display:flex;flex-wrap:wrap;gap:12px;padding:12px;overflow:auto}
  .card{width:160px;background:#0f141a;border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;position:relative}
  .thumb{width:100%;height:200px;object-fit:cover;border-radius:8px;background:#0b0f14}
  .title{display:block;margin-top:6px;font-size:.95em}
  .meta{color:var(--muted);font-size:.8em}
  .fav{position:absolute;top:8px;right:8px;background:#1c2128;border:1px solid #30363d;border-radius:999px;padding:4px 8px;font-weight:700;color:#ffd166}
  .fav.off{color:#9aa7b0}

  /* Series drawer */
  #drawer{display:none;position:fixed;inset:auto 0 0 0;background:#0b0f14;border-top:1px solid var(--border);max-height:65vh;overflow:auto}
  #drawerHead{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px}
  #drawer h3{margin:0}
  #drawerTools{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-block;padding:6px 8px;border-radius:6px;font-weight:700;text-decoration:none;cursor:pointer}
  .btn.primary{background:var(--accent);color:white;border:none}
  .btn.ghost{background:#1c2128;color:#c9d1d9;border:1px solid #30363d}
  #seasons{padding:10px;display:grid;gap:10px}
  .season{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .season summary{cursor:pointer;padding:10px;background:#0f141a}
  .episodes{padding:8px;display:grid;gap:8px}
  .ep{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:#0f141a;border:1px solid var(--border);border-radius:8px;padding:8px}
  .ep .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .copy{min-width:110px}

  @media (max-width:1100px){
    main{grid-template-columns:320px 1fr}
    #cats{display:none}
  }
</style>
</head>
<body>
<header>📺 IPTV — Live · Movies · Series (Categories + Favorites)</header>

<main>
  <!-- LEFT -->
  <aside id="left">
    <strong>Login</strong>
    <!-- Prefilled values -->
    <input id="host" value="http://line.tx-4k.com" placeholder="Host (e.g. http://line.tx-4k.com)">
    <input id="username" value="b126a24d3" placeholder="Username">
    <input id="password" type="password" value="36a7e66d5d" placeholder="Password">
    <button id="connect">Connect</button>
    <div id="status"></div>

    <hr style="border-color:#30363d;background:#30363d;height:1px;border:0;margin:8px 0"/>
    <strong>Browse</strong>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="liveBtn" class="ghost">📡 Live TV</button>
      <button id="moviesBtn" class="ghost">🎬 Movies</button>
      <button id="seriesBtn" class="ghost">📺 Series</button>
    </div>

    <div style="margin-top:6px;font-size:.85rem;color:#9aa7b0;line-height:1.35">
      <span class="pill warn">Note</span>
      Public CORS proxies can see your username/password (because they’re in the URL). Best fix is running your own proxy.
    </div>

    <button id="logout" class="ghost">Logout</button>
  </aside>

  <!-- CATEGORIES -->
  <aside id="cats">
    <h4 id="catsTitle">Categories</h4>
    <div id="catList"></div>
  </aside>

  <!-- RIGHT -->
  <section id="right">
    <div id="toolbar">
      <input id="search" placeholder="Search…" />
    </div>
    <div id="grid"></div>
  </section>
</main>

<!-- Series drawer -->
<div id="drawer">
  <div id="drawerHead">
    <h3 id="seriesTitle">Series</h3>
    <div id="drawerTools">
      <button id="copyAll" class="btn ghost">Copy All Links</button>
      <button id="downloadM3U" class="btn primary">Download M3U</button>
      <button id="closeDrawer" class="btn ghost">Close</button>
    </div>
  </div>
  <div id="seasons"></div>
</div>

<script>
/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
const trimSlash = s => s.replace(/\/$/,'');
const placeholderImg = 'https://via.placeholder.com/160x200?text=No+Image';

function setStatus(msg, kind){
  $('status').innerHTML = `<span class="pill ${kind==='ok'?'ok':kind==='err'?'err':kind==='warn'?'warn':''}">${msg}</span>`;
}
function safeName(s){ return (s||'').replace(/[^\w\s\-\.\(\)&]/g,'').trim(); }

function pickJsonText(text){
  const iObj = text.indexOf('{');
  const iArr = text.indexOf('[');
  let i = -1;
  if (iArr !== -1 && (iObj === -1 || iArr < iObj)) i = iArr;
  else i = iObj;
  return i === -1 ? text : text.slice(i);
}

/*
  IMPORTANT:
  Using a public proxy sends your IPTV credentials to that proxy.
  Best: run your OWN proxy and set PROXY_MODE='self' and PROXY_BASE to yours.
*/
const PROXY_MODE = 'public'; // 'public' | 'none' | 'self'
const PROXY_BASE = '';       // e.g. 'http://localhost:8787/' (your own proxy that forwards full URL)

function wrapUrl(url){
  if (PROXY_MODE === 'none') return url;
  if (PROXY_MODE === 'self') return PROXY_BASE + url;
  return url;
}

async function fetchJsonRobust(url){
  const direct = wrapUrl(url);

  const publicTries = [
    direct,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://cors.isomorphic-git.org/${url}`
  ];

  const tries = (PROXY_MODE === 'public') ? publicTries : [direct];

  let lastErr = null;
  for (const u of tries){
    try{
      const r = await fetch(u, { cache:'no-store' });
      const text = await r.text();
      const cleaned = pickJsonText(text);

      if (!r.ok){
        throw new Error(`HTTP ${r.status} :: ${cleaned.slice(0,180)}`);
      }
      return JSON.parse(cleaned);
    }catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error('Unknown fetch error');
}

/* ---------------- Local Storage (Favorites) ---------------- */
const store = {
  get favSeries(){ return JSON.parse(localStorage.getItem('fav_series_map')||'{}'); }, // id -> {id,name,cover}
  set favSeries(v){ localStorage.setItem('fav_series_map', JSON.stringify(v)); },
  get favCount(){ return JSON.parse(localStorage.getItem('fav_series_count')||'{}'); }, // id -> opens
  set favCount(v){ localStorage.setItem('fav_series_count', JSON.stringify(v)); },
};

/* ---------------- State ---------------- */
const S = {
  host:'', user:'', pass:'',
  kind:'',              // 'live' | 'vod' | 'series'
  categories:[],        // categories for current kind
  items:[],             // loaded items for current category
  filtered:[],
  filteredSource:[],
  page:0, size:30,
  currentCat:'all',

  // series details
  currentSeries: null,
  currentSeasons: {},
};

/* ---------------- Login ---------------- */
$('connect').onclick = async () => {
  S.host = trimSlash($('host').value.trim());
  S.user = $('username').value.trim();
  S.pass = $('password').value.trim(); // trims any accidental leading space
  if (!S.host || !S.user || !S.pass) return setStatus('Enter host / username / password', 'err');

  setStatus('Connecting…');
  try{
    const url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}`;
    const data = await fetchJsonRobust(url);

    if (data.user_info && String(data.user_info.auth) === '1'){
      setStatus('Login OK','ok');
      $('toolbar').style.display='flex';
      $('grid').innerHTML = '<p style="padding:12px;color:#9aa7b0">Pick Live / Movies / Series.</p>';
    } else {
      setStatus('Invalid login','err');
    }
  }catch(e){
    console.error(e);
    setStatus('Cannot connect (API). Check host or proxy.', 'err');
  }
};
$('logout').onclick = () => location.reload();

/* ---------------- Search ---------------- */
$('search').addEventListener('input', ()=>{
  const term = $('search').value.toLowerCase();
  const base = S.filteredSource || S.items || [];
  S.filtered = term ? base.filter(x => (x.name||'').toLowerCase().includes(term)) : base.slice();
  S.page = 0;
  paint();
});

/* ---------------- Nav ---------------- */
$('liveBtn').onclick = ()=> loadKind('live');
$('moviesBtn').onclick = ()=> loadKind('vod');
$('seriesBtn').onclick = ()=> loadKind('series');

function requireLogin(){
  if (!S.host || !S.user || !S.pass) throw new Error('Login first');
}

/* ---------------- Categories UI ---------------- */
function showCats(){ $('cats').style.display='flex'; }
function setCatsTitle(t){ $('catsTitle').textContent = t; }

function renderCategories(){
  showCats();
  const list = $('catList');
  list.innerHTML = '';

  const addBtn = (id, label, count, active=false) => {
    const b = document.createElement('div');
    b.className = 'catbtn' + (active ? ' active' : '');
    b.dataset.id = id;
    b.innerHTML = `<span>${label}</span><span class="badge">${count}</span>`;
    b.onclick = ()=> applyCategory(id);
    list.appendChild(b);
  };

  // Built-ins
  if (S.kind === 'series'){
    const favMap = store.favSeries;
    addBtn('all', 'Pick a category (recommended)', 0, S.currentCat==='all');
    addBtn('top', 'Top Favorites', Object.keys(favMap).length, S.currentCat==='top');
  } else {
    addBtn('all', 'Pick a category (recommended)', 0, S.currentCat==='all');
  }

  // Server categories
  for (const c of S.categories){
    addBtn(String(c.category_id), c.category_name || 'Category', '…', S.currentCat===String(c.category_id));
  }
}

/* ---------------- Loaders (category-first) ---------------- */
async function loadKind(kind){
  closeDrawer();
  try{ requireLogin(); } catch { return setStatus('Login first','err'); }

  S.kind = kind;
  S.currentCat = 'all';
  S.items = []; S.filtered = []; S.filteredSource = [];
  $('search').value = '';
  $('grid').innerHTML = `<p style="padding:12px">Loading ${kind==='live'?'Live TV':kind==='vod'?'Movies':'Series'} categories…</p>`;

  try{
    if (kind === 'live'){
      setCatsTitle('Live Categories');
      const url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_live_categories`;
      S.categories = await fetchJsonRobust(url);
      if (!Array.isArray(S.categories)) S.categories = [];
      renderCategories();
      $('grid').innerHTML = `<p style="padding:12px;color:#9aa7b0">Select a Live category to load channels.</p>`;
    }

    if (kind === 'vod'){
      setCatsTitle('Movie Categories');
      const url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_vod_categories`;
      S.categories = await fetchJsonRobust(url);
      if (!Array.isArray(S.categories)) S.categories = [];
      renderCategories();
      $('grid').innerHTML = `<p style="padding:12px;color:#9aa7b0">Select a Movie category to load titles.</p>`;
    }

    if (kind === 'series'){
      setCatsTitle('Series Categories');
      const url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_series_categories`;
      S.categories = await fetchJsonRobust(url);
      if (!Array.isArray(S.categories)) S.categories = [];
      renderCategories();
      $('grid').innerHTML = `<p style="padding:12px;color:#9aa7b0">Select a Series category to load shows (recommended). Or use Top Favorites.</p>`;
    }

    setStatus('Ready','ok');
  }catch(e){
    console.error(e);
    setStatus(`Failed to load categories: ${String(e.message||e).slice(0,120)}`, 'err');
    showCats();
    $('catList').innerHTML = `<div class="catbtn">Could not load categories.</div>`;
    $('grid').innerHTML = '';
  }
}

/* ---------------- Apply category -> load items ---------------- */
async function applyCategory(catId){
  S.currentCat = catId;
  $('search').value = '';
  closeDrawer();

  document.querySelectorAll('#catList .catbtn')
    .forEach(n => n.classList.toggle('active', n.dataset.id === S.currentCat));

  // Top Favorites (Series) - local only
  if (S.kind === 'series' && catId === 'top'){
    const favMap = store.favSeries;
    const counts = store.favCount;
    const favList = Object.values(favMap)
      .sort((a,b)=>{
        const ca = counts[String(a.id)] || 0;
        const cb = counts[String(b.id)] || 0;
        if (cb !== ca) return cb - ca;
        return (a.name||'').localeCompare(b.name||'');
      })
      .map(x => ({
        series_id: x.id,
        name: x.name,
        cover: x.cover || '',
        category_id: x.category_id || '',
        releaseDate: x.releaseDate || ''
      }));

    S.items = favList;
    S.filteredSource = favList.slice();
    S.filtered = favList.slice();
    S.page = 0;
    paint();
    return;
  }

  // Don’t load "ALL" (huge). Force category selection.
  if (catId === 'all'){
    S.items = []; S.filtered = []; S.filteredSource = [];
    $('grid').innerHTML = `<p style="padding:12px;color:#9aa7b0">Pick a category to load content (avoids huge payloads).</p>`;
    return;
  }

  $('grid').innerHTML = `<p style="padding:12px">Loading…</p>`;
  try{
    let url = '';
    if (S.kind === 'live'){
      url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_live_streams&category_id=${encodeURIComponent(catId)}`;
    } else if (S.kind === 'vod'){
      url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_vod_streams&category_id=${encodeURIComponent(catId)}`;
    } else {
      url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_series&category_id=${encodeURIComponent(catId)}`;
    }

    const data = await fetchJsonRobust(url);
    const arr = Array.isArray(data) ? data : [];
    S.items = arr;
    S.filteredSource = arr.slice();
    S.filtered = arr.slice();
    S.page = 0;
    paint();
    setStatus('Loaded','ok');
  }catch(e){
    console.error(e);
    setStatus(`Failed to load items: ${String(e.message||e).slice(0,140)}`, 'err');
    $('grid').innerHTML = `<p style="padding:12px;color:#ef4444">Failed to load this category.</p>`;
  }
}

/* ---------------- Grid ---------------- */
function paint(){
  const grid = $('grid');
  grid.innerHTML = '';

  const list = (S.filtered || []).slice(S.page*S.size, (S.page+1)*S.size);

  if (!list.length){
    grid.innerHTML = `<p style="padding:12px;color:#9aa7b0">No results.</p>`;
    return;
  }

  list.forEach(item=>{
    const card = document.createElement('div');
    card.className='card';

    let imgSrc = placeholderImg, title='Item', meta='';

    if (S.kind==='live'){
      imgSrc = (item.stream_icon && item.stream_icon !== 'null') ? item.stream_icon : placeholderImg;
      title = item.name || 'Channel';
      meta = item.category_name || '';
      const m3u8 = `${S.host}/live/${encodeURIComponent(S.user)}/${encodeURIComponent(S.pass)}/${item.stream_id}.m3u8`;
      card.onclick = ()=> window.open(m3u8, '_blank', 'noopener');
    } else if (S.kind==='vod'){
      imgSrc = (item.stream_icon && item.stream_icon !== 'null') ? item.stream_icon : placeholderImg;
      title = item.name || 'Movie';
      meta = (item.container_extension||'mp4').toUpperCase();
      const mp4 = `${S.host}/movie/${encodeURIComponent(S.user)}/${encodeURIComponent(S.pass)}/${item.stream_id}.mp4`;
      card.onclick = ()=> window.open(mp4, '_blank', 'noopener');
    } else {
      imgSrc = (item.cover && item.cover !== 'null') ? item.cover : (item.stream_icon||placeholderImg);
      title = item.name || 'Series';
      meta = item.releaseDate || '';

      card.onclick = ()=> openSeries(item);

      // Favorite toggle
      const star = document.createElement('button');
      const id = String(item.series_id);
      const favMap = store.favSeries;
      const isFav = !!favMap[id];

      star.className = 'fav' + (isFav ? '' : ' off');
      star.textContent = isFav ? '★' : '☆';
      star.title = 'Toggle favorite';
      star.onclick = (e)=>{ e.stopPropagation(); toggleFavSeries(item, star); };
      card.appendChild(star);
    }

    const img = document.createElement('img');
    img.className='thumb';
    img.src = imgSrc;
    img.onerror = ()=>{ img.src = placeholderImg; };

    const nameEl = document.createElement('span');
    nameEl.className='title';
    nameEl.textContent = title;

    const metaEl = document.createElement('div');
    metaEl.className='meta';
    metaEl.textContent = meta;

    card.appendChild(img);
    card.appendChild(nameEl);
    card.appendChild(metaEl);

    grid.appendChild(card);
  });

  if ((S.page+1)*S.size < (S.filtered || []).length){
    const more = document.createElement('button');
    more.textContent = 'Load More';
    more.className = 'ghost';
    more.style.margin = '10px auto';
    more.onclick = ()=>{ S.page++; paint(); };
    grid.appendChild(more);
  }
}

/* ---------------- Favorites (Series) ---------------- */
function toggleFavSeries(item, btn){
  const id = String(item.series_id);
  const favMap = store.favSeries;

  if (favMap[id]){
    delete favMap[id];
    btn.classList.add('off'); btn.textContent='☆';
  } else {
    favMap[id] = {
      id,
      name: item.name || 'Series',
      cover: item.cover || item.stream_icon || '',
      category_id: item.category_id || '',
      releaseDate: item.releaseDate || ''
    };
    btn.classList.remove('off'); btn.textContent='★';
  }

  store.favSeries = favMap;

  if (S.kind==='series' && S.currentCat==='top'){
    applyCategory('top');
  }
}

/* ---------------- Series drawer ---------------- */
$('closeDrawer').onclick = ()=> closeDrawer();
$('copyAll').onclick = ()=> {
  if (!S.currentSeries) return;
  const links = buildAllEpisodeLinks(S.currentSeasons);
  copyText(links.join('\n'));
  flash('Copied all episode links');
};
$('downloadM3U').onclick = ()=> {
  if (!S.currentSeries) return;
  const links = buildAllEpisodeLinks(S.currentSeasons);
  const m3u = buildM3U(links, S.currentSeries.name);
  downloadText(m3u, `${safeName(S.currentSeries.name || 'series')}.m3u`);
};

async function openSeries(serie){
  $('seriesTitle').textContent = serie.name || 'Series';
  S.currentSeries = { id: String(serie.series_id), name: serie.name || 'Series' };
  $('seasons').innerHTML = '<p style="padding:8px">Loading seasons & episodes…</p>';
  $('drawer').style.display = 'block';

  // open count
  const counts = store.favCount;
  counts[S.currentSeries.id] = (counts[S.currentSeries.id] || 0) + 1;
  store.favCount = counts;

  try{
    const url = `${S.host}/player_api.php?username=${encodeURIComponent(S.user)}&password=${encodeURIComponent(S.pass)}&action=get_series_info&series_id=${encodeURIComponent(serie.series_id)}`;
    const info = await fetchJsonRobust(url);

    const episodesBySeason = info.episodes || {};
    S.currentSeasons = episodesBySeason;

    const seasonsBox = $('seasons');
    seasonsBox.innerHTML = '';
    const seasonNums = Object.keys(episodesBySeason).sort((a,b)=>Number(a)-Number(b));

    if (!seasonNums.length){
      seasonsBox.innerHTML = '<p style="padding:8px">No episodes found.</p>';
      return;
    }

    seasonNums.forEach(seasonNo=>{
      const eps = episodesBySeason[seasonNo] || [];

      const det = document.createElement('details');
      det.className='season';

      const sum = document.createElement('summary');
      sum.textContent = `Season ${seasonNo} • ${eps.length} episode(s)`;

      const wrap = document.createElement('div');
      wrap.className='episodes';

      // Per-season tools
      const seasonTools = document.createElement('div');
      seasonTools.style.cssText = 'display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap';

      const btnCopySeason = document.createElement('button');
      btnCopySeason.className='btn ghost';
      btnCopySeason.textContent='Copy Season Links';
      btnCopySeason.onclick = (e)=>{
        e.preventDefault();
        const links = buildAllEpisodeLinks({[seasonNo]: eps});
        copyText(links.join("\n"));
        flash(`Copied Season ${seasonNo} links`);
      };

      const btnM3USeason = document.createElement('button');
      btnM3USeason.className='btn primary';
      btnM3USeason.textContent='Download Season M3U';
      btnM3USeason.onclick = (e)=>{
        e.preventDefault();
        const links = buildAllEpisodeLinks({[seasonNo]: eps});
        const m3u = buildM3U(links, `${S.currentSeries.name} - S${seasonNo}`);
        downloadText(m3u, `${safeName(S.currentSeries.name)}_S${seasonNo}.m3u`);
      };

      seasonTools.appendChild(btnCopySeason);
      seasonTools.appendChild(btnM3USeason);
      wrap.appendChild(seasonTools);

      eps.forEach(ep=>{
        const row = document.createElement('div');
        row.className='ep';

        const title = document.createElement('div');
        title.className='name';
        title.textContent = ep.title || `Episode ${ep.episode_num || ''}`;

        const ext = (ep.container_extension || 'mp4').replace(/^\./,'');
        const epUrl = `${S.host}/series/${encodeURIComponent(S.user)}/${encodeURIComponent(S.pass)}/${ep.id}.${ext}`;

        // Open Link (direct)
        const open = document.createElement('a');
        open.className='btn primary';
        open.textContent='Open Link';
        open.href = epUrl;
        open.target='_blank';
        open.rel='noopener';

        // Open in Browser (HTML5 player page)
        const openBrowser = document.createElement('button');
        openBrowser.className = 'btn ghost';
        openBrowser.textContent = 'Open in Browser';
        openBrowser.onclick = () => {
          const safe = s => String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const mime = ext.toLowerCase()==='m3u8'
            ? 'application/vnd.apple.mpegurl'
            : (ext.toLowerCase()==='mp4' ? 'video/mp4' : `video/${ext.toLowerCase()}`);

          const html = `<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>${safe(ep.title || 'Episode')}</title>
<style>
  body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,Segoe UI,Arial}
  header{padding:10px 12px;background:#161b22;border-bottom:1px solid #30363d;font-weight:700}
  .wrap{padding:12px;display:grid;gap:10px}
  video{width:100%;max-height:75vh;background:#000;border-radius:10px;border:1px solid #232a31}
  a{color:#2f81f7;text-decoration:none;font-weight:700}
  .muted{color:#9aa7b0;font-size:.9rem;line-height:1.35}
</style>
</head>
<body>
<header>Browser Player</header>
<div class="wrap">
  <div><strong>${safe(S.currentSeries?.name || 'Series')}</strong> — ${safe(ep.title || 'Episode')}</div>
  <video controls autoplay playsinline>
    <source src="${epUrl}" type="${mime}">
    Your browser can't play this stream. <a href="${epUrl}">Open direct link</a>
  </video>
  <div class="muted">
    If it doesn’t play: many browsers don’t support all stream types (especially HLS on Chrome/Windows). Use “Open Link” in VLC.
  </div>
</div>
</body>
</html>`;
          const blob = new Blob([html], { type: 'text/html' });
          const u = URL.createObjectURL(blob);
          window.open(u, '_blank', 'noopener');
          setTimeout(()=>URL.revokeObjectURL(u), 30000);
        };

        // Copy VLC Link
        const copy = document.createElement('button');
        copy.className='btn ghost copy';
        copy.textContent='Copy VLC Link';
        copy.onclick = async ()=>{
          await copyText(epUrl);
          copy.textContent='Copied!';
          setTimeout(()=>copy.textContent='Copy VLC Link', 1200);
        };

        row.appendChild(title);
        row.appendChild(open);
        row.appendChild(openBrowser);
        row.appendChild(copy);
        wrap.appendChild(row);
      });

      det.appendChild(sum);
      det.appendChild(wrap);
      seasonsBox.appendChild(det);
    });

    const first = seasonsBox.querySelector('details');
    if (first) first.open = true;

  }catch(e){
    console.error(e);
    $('seasons').innerHTML = `<p style="padding:8px;color:#ef4444">Failed to load episodes: ${String(e.message||e).slice(0,120)}</p>`;
  }
}

function closeDrawer(){
  $('drawer').style.display='none';
  S.currentSeries=null;
  S.currentSeasons={};
}

/* ---------------- Link builders & utils ---------------- */
function buildAllEpisodeLinks(bySeason){
  const links = [];
  const seasonNums = Object.keys(bySeason).sort((a,b)=>Number(a)-Number(b));
  seasonNums.forEach(s=>{
    (bySeason[s]||[]).forEach(ep=>{
      const ext = (ep.container_extension || 'mp4').replace(/^\./,'');
      links.push(`${S.host}/series/${encodeURIComponent(S.user)}/${encodeURIComponent(S.pass)}/${ep.id}.${ext}`);
    });
  });
  return links;
}

function buildM3U(links, title='Playlist'){
  let m3u = '#EXTM3U\n';
  links.forEach((u, i)=>{
    m3u += `#EXTINF:-1,${title} ${String(i+1).padStart(2,'0')}\n${u}\n`;
  });
  return m3u;
}

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); } catch {}
}

function downloadText(txt, filename){
  const blob = new Blob([txt], {type:'audio/x-mpegurl'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename || 'playlist.m3u';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function flash(msg){
  const prev = $('status').innerHTML;
  setStatus(msg,'ok');
  setTimeout(()=>{ $('status').innerHTML = prev; }, 1200);
}
</script>
</body>
</html>
